# tv-remote: ESP32-C3 as a BLE wake beacon for a Xiaomi (MediaTek MT7668) Android TV.
# It uses the TV remote's BT address and replays the remote's wake advert on demand, so the
# TV wakes from standby and from cold-off after a power cut. Beacon only: never advertises on
# its own, never connectable, so the real remote's bond is untouched. See README.md.
esphome:
  name: tv-remote
  friendly_name: TV Remote

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_BLE_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "y"
      CONFIG_BT_NIMBLE_HID_SERVICE: "y"
      CONFIG_BT_HID_DEVICE_ENABLED: "y"
      CONFIG_BT_NIMBLE_NVS_PERSIST: "y"
      CONFIG_BT_NIMBLE_SM_SC: "y"

logger:

api:
  encryption:
    key: !secret api_key
  actions:
    # HA: esphome.tv_remote_tv_wake_mtk -> 10 s clone of the Xiaomi remote's wake advert, sent from
    # the remote's own BT address, non-connectable. Wakes the TV from standby (~3 s) and from
    # cold-off after a power cut (~30 s to network). Call it from a Home Assistant script before anything that needs the TV awake.
    - action: tv_wake_mtk
      then:
        - ble_keyboard.mtk_wake:
            id: tv_kb
            mac: "14:63:93:6F:C4:8E"
            duration: 10000

web_server:

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.116   # change
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "TV Remote Fallback"
    password: "changeme"

captive_portal:

safe_mode:
  reboot_timeout: 10min
  num_attempts: 20

# Fork of github.com/adesanto84/esphome-blekeyboard with the wake additions (this repo).
external_components:
  - source: github://ssw112/xiaomi-tv-ble-wake@main
    components: [ble_keyboard]

ble_keyboard:
  id: tv_kb
  name: "TV-Remote"
  manufacturer_id: "ESPHome"
  # 2026-10-20: beacon-only mode. The board borrows the Xiaomi remote's BT address so the TV's
  # cold-off wake filter (which only knows that address) accepts the cloned wake advert.
  # No normal HID advertising (would confuse the TV's bond with the real remote).
  bt_mac: "54:A4:93:4D:1A:4B"
  advertise_on_boot: false
  reconnect: false
  battery_level: 100
  buttons: false

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: template
    name: "TV Wake MTK"
    icon: mdi:television-ambient-light
    on_press:
      - ble_keyboard.mtk_wake:
          id: tv_kb
          mac: "14:63:93:6F:C4:8E"
          duration: 10000
